name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test C#
      run: dotnet run --project . --Language=cs --BaseInputDir=./TestData --BaseOutputDir=./output/cs

    - name: Test TypeScript
      run: dotnet run --project . --Language=ts --BaseInputDir=./TestData --BaseOutputDir=./output/ts

    - name: Test TypeScript (Effect Schema)
      run: dotnet run --project . --Language=ts --TsSchema=effect --BaseInputDir=./TestData --BaseOutputDir=./output/ts-effect

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Type-check TypeScript (Effect Schema)
      working-directory: ./output/ts-effect
      run: |
        npm init -y
        npm install --no-save effect@3.22.4 typescript@5.9.3
        ./node_modules/.bin/tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node $(find . -name '*.ts' -not -path './node_modules/*')

    - name: Check TypeScript (Effect Schema) decoding
      working-directory: ./output/ts-effect
      run: |
        ./node_modules/.bin/tsc --strict --target ES2020 --module commonjs --moduleResolution node --outDir dist $(find . -name '*.ts' -not -path './node_modules/*' -not -path './dist/*')
        cat > check.cjs <<'EOF'
        const { Schema } = require("effect");
        const { EnumContainer } = require("./dist/Enums.js");

        const decoded = Schema.decodeUnknownSync(EnumContainer)({ productType: 1 });
        if (decoded.productType !== 1 || decoded.userRole !== 5 || decoded.windowOptions !== 5) {
          throw new Error("decoded defaults do not match: " + JSON.stringify(decoded));
        }

        let threw = false;
        try {
          Schema.decodeUnknownSync(EnumContainer)({ productType: "not-an-enum" });
        } catch {
          threw = true;
        }
        if (!threw) throw new Error("invalid payload was accepted");

        console.log("Effect Schema decoding check passed");
        EOF
        node check.cjs

    - name: Test Unreal
      run: dotnet run --project . --Language=unreal --BaseInputDir=./TestData --BaseOutputDir=./output/unreal

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Test Python
      run: |
        dotnet run --project . --Language=py --BaseInputDir=./TestData --BaseOutputDir=./output/py
        python -m compileall -q output/py
        python - <<'EOF'
        import datetime
        import importlib
        import pkgutil
        import sys

        sys.path.insert(0, "output")

        import py

        for module in pkgutil.walk_packages(py.__path__, py.__name__ + "."):
            importlib.import_module(module.name)

        from py.common.address import Address
        from py.enums import ProductType, UserRole
        from py.user import User

        address = Address(street="1 Main Street", city="Springfield", postal_code="12345", country="US")
        user = User(
            user_id=1,
            username="catalyst",
            email="catalyst@example.com",
            registration_date=datetime.datetime(2024, 1, 15, 10, 30, tzinfo=datetime.timezone.utc),
            shipping_address=address,
        )

        payload = user.to_dict()
        assert payload["userId"] == 1
        assert payload["registrationDate"] == "2024-01-15T10:30:00Z"
        assert payload["shippingAddress"]["postalCode"] == "12345"
        assert User.from_dict(payload) == user
        assert User.from_json(user.to_json()) == user
        assert Address.from_dict(address.to_dict()) == address
        assert ProductType(ProductType.HOUSEHOLD) == ProductType.HOUSEHOLD
        assert UserRole(UserRole.MODERATOR | UserRole.ADMIN) == UserRole.MODERATOR | UserRole.ADMIN
        EOF

    - name: Test unions, string enums and presence (Python)
      run: |
        dotnet run --project . --Language=py --BaseInputDir=./TestDataExtended --BaseOutputDir=./output/py_extended --NoTimestamp=true
        python -m compileall -q output/py_extended
        python scripts/check-extended.py
        pip install --quiet mypy
        python -m mypy --strict --python-version 3.10 output/py_extended

    - name: Test unions, string enums and presence (TypeScript)
      run: |
        dotnet run --project . --Language=ts --TsSchema=effect --BaseInputDir=./TestDataExtended --BaseOutputDir=./output/ts-extended --NoTimestamp=true
        dotnet run --project . --Language=ts --BaseInputDir=./TestDataExtended --BaseOutputDir=./output/ts-extended-class --NoTimestamp=true
        mkdir -p /tmp/ts-check && cd /tmp/ts-check && npm init -y >/dev/null && npm install --no-save effect@3.22.4 typescript@5.9.3 tsx@4.20.6
        cd "$GITHUB_WORKSPACE" && ln -sfn /tmp/ts-check/node_modules node_modules
        ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module nodenext --moduleResolution nodenext --skipLibCheck scripts/check-extended.ts output/ts-extended/*.ts
        ./node_modules/.bin/tsc --noEmit --strict --strictPropertyInitialization false --target ES2022 --module nodenext --moduleResolution nodenext --skipLibCheck output/ts-extended-class/*.ts
        ./node_modules/.bin/tsx scripts/check-extended.ts

    - name: C# and Unreal reject unions
      run: |
        for language in cs unreal; do
          if dotnet run --project . --Language=$language --BaseInputDir=./TestDataExtended --BaseOutputDir=./output/$language-extended > out.txt 2>&1; then
            echo "$language accepted a spec it cannot generate"; exit 1
          fi
          grep -q "does not support unions" out.txt
        done
